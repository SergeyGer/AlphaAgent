name: Feature request
description: Suggest a capability or improvement.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please describe the problem first — proposals
        grounded in a concrete use case get prioritised.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      placeholder: As an operator I cannot tell how much of my daily loss budget has been consumed...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - REST API
        - AI layer (CrewAI)
        - Celery / async engine
        - Execution guard / risk limits
        - Database / models
        - Observability
        - Docker / deployment
        - Documentation
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: Does this touch the trading guardrails?
      description: Changes here need thorough tests, since they govern real money movement.
      options:
        - "No — no effect on trade execution"
        - "Yes — it changes when or how trades execute"
        - "Unsure"
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this.
          required: false
