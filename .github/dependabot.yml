version: 2

# Strategy: monthly, tightly grouped.
#
# The first release of this file opened 11 pull requests within minutes, most of
# them single-package major bumps. That is noise, not maintenance. Everything is
# now monthly and grouped so a normal month produces two or three reviewable PRs
# instead of a dozen.
#
# Grouping rules:
#   * `patterns: ["*"]` sweeps every remaining dependency into one PR per
#     ecosystem, so nothing arrives ungrouped.
#   * `update-types` splits major bumps into their own PR. A major version is a
#     breaking change and deserves individual review; minor and patch releases
#     are safe to batch.
#
# `day` is intentionally omitted: it accepts weekday names and only applies to
# weekly schedules. Monthly runs happen on the 1st.
updates:
  # ---------------------------------------------------------------------
  # Python runtime + dev dependencies
  # ---------------------------------------------------------------------
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # ------------------------------------------------------------------
      # chromadb: no fix exists, and none can be installed.
      #
      # requirements.txt is a pip-tools lockfile now, so chromadb is visible to
      # the dependency graph for the first time - it arrives transitively via
      # crewai. Four advisories apply (PYSEC-2026-311, -3813, -3814, -3815) and
      # every one reports "no fix available": crewai 1.15.23 pins
      # `chromadb~=1.1.0`, and 1.15.23 is the newest crewai on PyPI, so no
      # release both fixes them and satisfies the constraint.
      #
      # Triage: all four are server-side - pre-auth code injection against a
      # running Chroma server, malicious model-repo loading, and two RBAC /
      # tenant-isolation flaws. This project never imports chromadb, runs no
      # Chroma server, publishes no port for one, and constructs its Crew with
      # memory=False, so the vulnerable surfaces are unreachable.
      #
      # Remove this entry once crewai widens the pin AND a patched release
      # exists, or it silently suppresses an alert that has become fixable.
      - dependency-name: "chromadb"
      # crewai 1.15.23 pins `openai<3,>=2.30.0`. Proposing 3.x produces a PR
      # that cannot install (pip: ResolutionImpossible). Remove once crewai
      # widens the bound.
      - dependency-name: "openai"
        versions: [">=3.0.0"]
      # crewai 1.15.23 pins `pydantic<2.13,>=2.11.9` for the same reason.
      - dependency-name: "pydantic"
        versions: [">=2.13.0"]
      # Django 5.2 is the LTS line (longer security-support window than the
      # regular 6.x releases) and the README documents Django 5.x. Revisit at
      # 6.2 LTS, or when moving off the LTS line deliberately. Patch and minor
      # updates within 5.x still flow through.
      - dependency-name: "Django"
        versions: [">=6.0.0"]
    groups:
      # Breaking changes, one PR each so they can be reviewed properly.
      python-major:
        patterns: ["*"]
        update-types: ["major"]
      # Everything compatible, batched together.
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # Security-relevant surfaces stay individually visible.
      django:
        patterns: ["django*", "djangorestframework*"]
        update-types: ["minor", "patch"]
      ai:
        patterns: ["crewai*", "openai*", "anthropic*", "pydantic*", "yfinance*"]
        update-types: ["minor", "patch"]
      celery:
        patterns: ["celery*", "redis*", "kombu*", "amqp*", "vine*", "billiard*"]
        update-types: ["minor", "patch"]

  # ---------------------------------------------------------------------
  # GitHub Actions
  # ---------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-major:
        patterns: ["*"]
        update-types: ["major"]
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ---------------------------------------------------------------------
  # Base images (python:3.12-slim, node:22-alpine)
  # ---------------------------------------------------------------------
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # Every crewai release declares `Requires-Python <3.14`, so the runtime
      # image cannot move to 3.14 yet. Remove once a release supports it.
      - dependency-name: "python"
        versions: [">=3.14"]
    groups:
      docker-all:
        patterns: ["*"]
