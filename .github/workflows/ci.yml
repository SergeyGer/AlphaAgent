name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  # Values below are throwaway CI-only credentials, never used outside this job.
  DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
  DJANGO_DEBUG: "false"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
  POSTGRES_DB: alpha_agent_db
  POSTGRES_USER: alpha_user
  POSTGRES_PASSWORD: ci-only-postgres-password
  POSTGRES_HOST: 127.0.0.1
  POSTGRES_PORT: "5432"
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: "6379"
  CELERY_BROKER_URL: redis://127.0.0.1:6379/0
  CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
  # Keep the suite fully offline and deterministic.
  AI_LLM_PROVIDER: none
  AI_LLM_API_KEY: ""

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install tooling
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check --diff .

      - name: Django system checks
        run: python manage.py check --deploy
        env:
          # `check --deploy` warns on insecure defaults; fail on real errors only.
          DJANGO_DEBUG: "false"

  test:
    name: Tests (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: write # to commit the regenerated coverage badge
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16"]
        python: ["3.12"]

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_DB: alpha_agent_db
          POSTGRES_USER: alpha_user
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alpha_user -d alpha_agent_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Wait for PostgreSQL
        run: |
          python - <<'PY'
          import os, sys, time
          import psycopg2

          for attempt in range(30):
              try:
                  psycopg2.connect(
                      dbname=os.environ["POSTGRES_DB"],
                      user=os.environ["POSTGRES_USER"],
                      password=os.environ["POSTGRES_PASSWORD"],
                      host=os.environ["POSTGRES_HOST"],
                      port=os.environ["POSTGRES_PORT"],
                      connect_timeout=3,
                  ).close()
                  print(f"PostgreSQL ready after {attempt + 1} attempt(s)")
                  sys.exit(0)
              except psycopg2.OperationalError as exc:
                  print(f"waiting for PostgreSQL: {exc}")
                  time.sleep(2)

          sys.exit("PostgreSQL did not become ready in time")
          PY

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run test suite under coverage
        run: |
          coverage run manage.py test core.tests --verbosity=2
          coverage report

      # The floor is a ratchet, not a target: it exists so a change cannot quietly
      # delete coverage. Measured at 76% when introduced, so 70% leaves room for
      # an honest dip without failing on noise.
      - name: Enforce coverage floor
        run: coverage report --fail-under=70

      - name: Render the coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/coverage_badge.py -o coverage.svg

      # Committed back so the README badge is live without a third-party service
      # such as Codecov. `[skip ci]` stops the badge commit re-triggering CI.
      - name: Commit the badge if it changed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- coverage.svg; then
            echo "coverage.svg unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.svg
          git commit -m "chore: update coverage badge [skip ci]"
          git push

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: alphaagent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify compose configuration
        # Runs against a fresh checkout, which has no .env - the same state a
        # new contributor is in before `cp .env.example .env`.
        run: docker compose config --quiet

      - name: Smoke-test the image
        run: |
          docker run --rm alphaagent:ci python -c "import django, celery, crewai, yfinance; print('imports OK')"
          # A real boot, not just --help: `manage.py --help` exits 0 without
          # loading settings, so it would not catch a broken configuration.
          docker run --rm \
            -e DJANGO_SECRET_KEY=ci-smoke-key \
            -e POSTGRES_PASSWORD=ci-smoke-password \
            alphaagent:ci python manage.py check
