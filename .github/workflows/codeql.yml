name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly, so newly disclosed patterns are caught without new commits.
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-and-quality
          # Loads this repository's model pack, which declares
          # `log_safe` and `normalise_ticker` as taint barriers. Without it the
          # analysis cannot see that those helpers neutralise their input, and
          # reports the call sites as py/log-injection. See the pack's README
          # comment for why this is preferable to inlining the sanitiser.
          packs: |
            ./.github/codeql/model-pack

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
