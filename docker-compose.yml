# AlphaAgent - full stack.
#
#   docker compose up -d --build
#   docker compose exec web python manage.py migrate
#   docker compose exec web python manage.py seed_demo --autonomous --confirm
#
# The application tier (web/worker/beat) runs from the image built by the
# Dockerfile; no service sets a restart policy, so nothing comes back on reboot
# and host reboots instead of vanishing when a parent shell exits.

x-app: &app
  build: .
  image: alphaagent:latest
  # Optional on purpose: a fresh clone has no .env until `cp .env.example .env`,
  # and a required env_file makes `docker compose config` fail before it exists
  # (which is what broke the CI Docker job).
  env_file:
    - path: .env
      required: false
  # `environment` wins over `env_file`, so the in-container service hostnames
  # override the 127.0.0.1 defaults that suit a bare-metal dev run.
  environment: &app_env
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-only-redis-password-change-me}
    CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-dev-only-redis-password-change-me}@redis:6379/0
    CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-dev-only-redis-password-change-me}@redis:6379/1
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,web
    # Points the crew at the MCP service. Only used when AI_TOOLS_VIA_MCP=true.
    AI_MCP_SERVER_URL: http://mcp:8100/mcp
    # Shared with the MCP service so the worker can authenticate to it. Every
    # service receives it because the anchor is shared; only the worker and the
    # server actually use it.
    MCP_SHARED_SECRET: ${MCP_SHARED_SECRET:-dev-only-mcp-shared-secret-change-me}
  # Deliberately NOT `always` or `unless-stopped`.
  #
  # Those policies bring the stack back automatically when the Docker daemon
  # starts, which means a server reboot silently restarts this demo - consuming
  # resources and, if it is autonomous, resuming trading without anyone asking.
  # A demo should start when someone starts it.
  #
  # Override with `restart: unless-stopped` in a local override file if you want
  # a long-running deployment instead.
  restart: "no"
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # ---------------------------------------------------------------------
  # Data tier
  # ---------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: alpha_postgres
    restart: "no"
    environment:
      # Sourced from .env - never hard-code credentials in this file.
      # `:?` makes compose abort with a clear message if it is unset.
      POSTGRES_DB: ${POSTGRES_DB:-alpha_agent_db}
      POSTGRES_USER: ${POSTGRES_USER:-alpha_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alpha_user} -d ${POSTGRES_DB:-alpha_agent_db}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: alpha_redis
    restart: "no"
    # Authentication. Redis ships with none, and this stack ran that way, so
    # anything that could reach 6379 had full control of the Celery broker, the
    # cache and the WebSocket channel layer.
    #
    # The port stays published because the documented host workflow needs it - the
    # Makefile runs `manage.py test` and the seed command from the host against
    # 127.0.0.1. With a password in place that is a protected port rather than an
    # open one. To close it entirely, drop the `ports:` block and run everything
    # through `docker compose exec`.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-dev-only-redis-password-change-me}
      - --appendonly
      - "yes"
    environment:
      # Read by the healthcheck rather than passed on the command line:
      # `redis-cli -a` puts the password in the process list, where any user on
      # the box can read it with `ps`. REDISCLI_AUTH keeps it out of argv.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-only-redis-password-change-me}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      # `redis-cli ping` returns NOAUTH once requirepass is set, so an
      # unauthenticated healthcheck would report the container unhealthy forever
      # and every service waiting on `service_healthy` would never start.
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ---------------------------------------------------------------------
  # Application tier
  # ---------------------------------------------------------------------
  web:
    <<: *app
    container_name: alpha_web
    # NOTE: commands are YAML *lists* on purpose. A folded scalar (``>``) keeps
    # the newlines of more-indented continuation lines, which silently truncated
    # the command to `gunicorn config.wsgi:application` and made gunicorn fall
    # back to its defaults (127.0.0.1:8000, 1 worker) - unreachable from the host.
    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        exec daphne -b 0.0.0.0 -p 8000 config.asgi:application
    ports:
      # Host port is configurable because this stack is not always the only
      # thing on the machine - 8000 is a common default and collisions are
      # silent until a bind fails. The CONTAINER port stays 8000, so the
      # image, the healthcheck and DJANGO_ALLOWED_HOSTS are unaffected.
      - "${ALPHA_WEB_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Autonomous agent sweep: consumes the fan-out subtasks.
  worker:
    <<: *app
    container_name: alpha_worker
    command:
      - celery
      - -A
      - config
      - worker
      - --loglevel=info
      - --concurrency=4
      - --max-tasks-per-child=200
      - -n
      - alphaagent-worker@%h
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d alphaagent-worker@$$(hostname) || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s

  # Market-data tools over the Model Context Protocol.
  #
  # The same tools the crew uses, exposed on an open protocol so any MCP client
  # (Claude Code, Cursor, a local Ollama agent, another framework) can call them
  # without touching this codebase. Strictly read-only: no tool here can read
  # portfolio state or place a trade.
  mcp:
    <<: *app
    container_name: alpha_mcp
    command:
      - python
      - -m
      - mcp_server
      - --transport
      - http
      - --host
      - 0.0.0.0
      - --port
      - "8100"
    environment:
      <<: *app_env
      MCP_LOG_LEVEL: INFO
      # Never leave the stdio transport's framing to chance: logs go to stderr.
      PYTHONUNBUFFERED: "1"
    # Deliberately NOT published to the host.
    #
    # This used to map 8100:8100, with no authentication on the server at all -
    # an anonymous HTTP endpoint on the host's network, for no reason. The tools
    # are read-only public market data, so the exposure was not severe, but "the
    # data is public anyway" stops being true the moment a tool is added that is
    # not.
    #
    # The service is now reachable only from inside the compose network, and each
    # request must also carry the shared secret. Two independent controls, because
    # either alone has a failure mode: a published port with no auth is open to
    # anyone who can route to it, and an unpublished port with auth still trusts
    # the network it sits on.
    expose:
      - "8100"
    healthcheck:
      # A TCP connect is enough: the MCP endpoint needs a JSON-RPC handshake.
      test:
        - CMD-SHELL
        - >-
          python -c "import socket; socket.create_connection(('127.0.0.1', 8100), 3)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Celery Beat: the cron scheduler for autonomous_market_monitoring_task.
  beat:
    <<: *app
    container_name: alpha_beat
    command:
      - sh
      - -c
      - >-
        rm -f /app/celerybeat-schedule &&
        exec celery -A config beat --loglevel=info --schedule /app/celerybeat-schedule

volumes:
  postgres_data:
  redis_data:
